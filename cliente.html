<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holbox Island Tours - Nueva Reserva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        .required {
            color: #ff6b6b;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .price-info {
            background: #f0f9ff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: #0099cc;
            border-left: 4px solid #00d4ff;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stripe-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .stripe-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 14px;
        }

        .stripe-button:hover {
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        @media (max-width: 600px) {
            .form-content {
                padding: 20px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 40px; margin-bottom: 10px;">🏝️</div>
            <h1>Holbox Island Tours</h1>
            <p>Tours de lujo en la Isla de Holbox 🌴</p>
        </div>

        <div class="form-content">
            <h2 style="color: #333; margin-bottom: 20px; font-size: 20px;">📝 Nueva Reserva</h2>

            <div id="alertBox" class="alert"></div>

            <form id="bookingForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono <span class="required">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+52 984 111 3302">
                </div>

                <div class="form-group">
                    <label for="tour">Tour <span class="required">*</span></label>
                    <select id="tour" name="tour" required onchange="actualizarPrecio()">
                        <option value="">Selecciona un tour...</option>
                        <option value="Whale Shark Tour">Whale Shark Tour - $2,800 MXN</option>
                        <option value="Bioluminiscencia Clásica">Bioluminiscencia Clásica - $450 MXN</option>
                        <option value="Bioluminiscencia Kayak">Bioluminiscencia Kayak - $1,000 MXN</option>
                        <option value="3 Islands Tour">3 Islands Tour - $800 MXN</option>
                    </select>
                    <div id="priceInfo" class="price-info"></div>
                </div>

                <div class="form-group">
                    <label for="personas">Cantidad de Personas <span class="required">*</span></label>
                    <input type="number" id="personas" name="personas" value="1" min="1" max="20" required onchange="actualizarPrecio()">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha del Tour <span class="required">*</span></label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="hotel">Hotel / Pick Up <span class="required">*</span></label>
                    <input type="text" id="hotel" name="hotel" required placeholder="Ej: Hotel Paraíso">
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios (Opcional)</label>
                    <textarea id="comentarios" name="comentarios" placeholder="Algún comentario adicional..."></textarea>
                </div>

                <button type="submit" id="submitBtn">
                    Guardar Reserva
                </button>
            </form>

            <div class="stripe-section">
                <p style="color: #666; font-size: 13px; margin-bottom: 15px; text-align: center;">
                    💳 Pagar con tarjeta (selecciona tu tour arriba)
                </p>
                <button id="stripeBtn" type="button" class="stripe-button" style="display: none;">
                    Ir a Pago Seguro
                </button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
webhookUrl: '/.netlify/functions/webhook',                'Whale Shark Tour': 'https://buy.stripe.com/4gMfZgfLNbqH9U964743T2x',
                'Bioluminiscencia Clásica': 'https://buy.stripe.com/7sYcN4dDFcuL0jzbor43T2y',
                'Bioluminiscencia Kayak': 'https://buy.stripe.com/eVqbJ06bdbqHeap3VZ43T2z',
                '3 Islands Tour': 'https://buy.stripe.com/eVqbJ06bdbqHeap3VZ43T2z'
            },
            tourPrices: {
                'Whale Shark Tour': 2800,
                'Bioluminiscencia Clásica': 450,
                'Bioluminiscencia Kayak': 1000,
                '3 Islands Tour': 800
            }
        };

        function actualizarPrecio() {
            const tour = document.getElementById('tour').value;
            const personas = parseInt(document.getElementById('personas').value) || 1;
            const priceInfo = document.getElementById('priceInfo');
            const stripeBtn = document.getElementById('stripeBtn');

            if (!tour) {
                priceInfo.innerHTML = '';
                stripeBtn.style.display = 'none';
                return;
            }

            const precioUnitario = CONFIG.tourPrices[tour];
            const precioTotal = precioUnitario * personas;
            const montoPendiente = precioTotal * 0.5;

            priceInfo.innerHTML = `
                💰 Precio por persona: $${precioUnitario.toLocaleString('es-MX')} MXN<br>
                <strong>Total: $${precioTotal.toLocaleString('es-MX')} MXN</strong><br>
                Anticipo requerido (50%): $${montoPendiente.toLocaleString('es-MX')} MXN
            `;

            if (CONFIG.stripeLinks[tour]) {
                stripeBtn.style.display = 'block';
                stripeBtn.onclick = () => window.open(CONFIG.stripeLinks[tour], '_blank');
            }

            window.currentPrice = precioTotal;
            window.currentMontoPendiente = montoPendiente;
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = mensaje;
            alertBox.className = `alert ${tipo}`;
            
            if (tipo === 'success') {
                setTimeout(() => {
                    alertBox.className = 'alert';
                }, 5000);
            }
        }

        async function enviarReserva(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Guardando...';

            const formData = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                tour: document.getElementById('tour').value,
                personas: document.getElementById('personas').value,
                fecha: document.getElementById('fecha').value,
                hotel: document.getElementById('hotel').value,
                comentarios: document.getElementById('comentarios').value,
                precio: window.currentPrice || 0,
                montoPendiente: window.currentMontoPendiente || 0,
                source: 'app-reservas'
            };

            try {
                const response = await fetch(CONFIG.webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    mostrarAlerta('✅ ¡Reserva guardada exitosamente! Te enviaremos un email de confirmación.', 'success');
                    document.getElementById('bookingForm').reset();
                    document.getElementById('priceInfo').innerHTML = '';
                    document.getElementById('stripeBtn').style.display = 'none';
                } else {
                    mostrarAlerta('❌ Error al guardar la reserva. Intenta de nuevo.', 'error');
                    console.error('Error response:', data);
                }
            } catch (error) {
                mostrarAlerta('❌ Error de conexión. Intenta de nuevo.', 'error');
                console.error('Fetch error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Guardar Reserva';
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', enviarReserva);

        // Establecer fecha mínima como hoy
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').setAttribute('min', today);
    </script>
</body>
</html>
