<!DOCTYPE html>
<html>
<head>
    <script>
        // Recibir POST request y redirigir a Google Apps Script
        const params = new URLSearchParams(window.location.search);
        const data = {};
        
        for (let [key, value] of params) {
            data[key] = value;
        }
        
        // Si hay datos, enviar a Google Apps Script
        if (Object.keys(data).length > 0) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'https://script.google.com/macros/s/AKfycbzgrOb6RYT3QAxBMUu5uELOvbtFU2o2-65oPOE0e0tXiW2DCaJuFGbznQ2dN6gzqfkn/exec';
            
            for (let key in data) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                form.appendChild(input);
            }
            
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</head>
<body>
    Procesando...
</body>
</html>
